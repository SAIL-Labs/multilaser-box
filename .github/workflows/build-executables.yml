name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install numpy pyserial PyQt6 pyvisa pyvisa-py psutil pyinstaller pyusb certifi

      - name: Set version for build
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Set-Content -Path multilaser/_version.py -Value "__version__ = `"$version`""
          Write-Host "Building version: $version"

      - name: Build Windows executable
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          pyinstaller --onefile --windowed --name="MultiLaserController-v$version" --icon=figures/icon.ico --add-data="figures/icon.ico;figures" --hidden-import=pyvisa --hidden-import=pyvisa_py multilaser/laser_controller_gui.py

      - name: Package Windows artifacts
        run: |
          mkdir -p release/windows
          copy dist\MultiLaserController-v*.exe release\windows\
          copy README.md release\windows\
          copy docs/multilaser_manual.md release\windows\
          xcopy /E /I laser_ttl_controller release\windows\laser_ttl_controller

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiLaserController-Windows
          path: release/windows/

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MultiLaserController-Windows
          path: windows-release/

      - name: Create release archives
        run: |
          cd windows-release && zip -r ../MultiLaserController-Windows.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            MultiLaserController-Windows.zip
          generate_release_notes: true
          body: |
            ## Installation
            1. Download `MultiLaserController-Windows.zip`
            2. Extract and run the `.exe` file

            ## Changes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
